name: Build Base Docker Image

# This workflow builds the base PHP image with all extensions
# Run this manually or when Dockerfile.base changes
# Base image is used by the main application Dockerfile

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the base image (e.g., 8.4, 8.4-v2)'
        required: true
        default: 'spendy-old-8.4-latest'
  
  # Automatic trigger when base Dockerfile changes
  push:
    branches:
      - spendy-old
    paths:
      - 'Dockerfile'
      - 'build.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Base Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=8.4-latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            # Custom tag or default
            type=raw,value=${{ steps.tag.outputs.tag }}
            # Also tag with date for versioning
            type=raw,value=${{ steps.tag.outputs.tag }}-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=Spendy Base Image
            org.opencontainers.image.description=PHP 8.4-FPM Alpine base image with pre-installed extensions
            org.opencontainers.image.vendor=Spendy

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Output image details
        run: |
          echo "## Base Image Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Update Application Dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "Update the \`ARG BASE_IMAGE\` line in your \`Dockerfile\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "ARG BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PHP Extensions Included" >> $GITHUB_STEP_SUMMARY
          echo "- pdo, pdo_pgsql, pdo_mysql, pgsql" >> $GITHUB_STEP_SUMMARY
          echo "- mbstring, gettext" >> $GITHUB_STEP_SUMMARY
          echo "- gd, exif, imagick" >> $GITHUB_STEP_SUMMARY
          echo "- zip, intl, bcmath" >> $GITHUB_STEP_SUMMARY
          echo "- pcntl, sockets" >> $GITHUB_STEP_SUMMARY
          echo "- sodium, opcache" >> $GITHUB_STEP_SUMMARY
          echo "- redis" >> $GITHUB_STEP_SUMMARY

      - name: Base image ready
        run: |
          echo "✅ Base Docker image built and pushed to GHCR"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          echo "🔧 Update your Dockerfile to use this base image"

